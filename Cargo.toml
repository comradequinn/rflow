[package]
name = "rflow"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "http1", "webpki-roots", "tls12"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
